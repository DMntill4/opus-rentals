# =============================================================================
# OPUS RENTALS - APPLICATION CONFIGURATION
# =============================================================================

spring.application.name=opus-rentals-backend
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/

# -----------------------------------------------------------------------------
# DATASOURCE (MYSQL)
# -----------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:opus_rentals_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:opus_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:opus_secure_password_2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------------------------------------
# JPA / HIBERNATE
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -----------------------------------------------------------------------------
# SQL INITIALIZATION (Fallback for non-docker local runs)
# -----------------------------------------------------------------------------
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

# -----------------------------------------------------------------------------
# SECURITY & JWT CONFIGURATION
# -----------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -----------------------------------------------------------------------------
# CORS CONFIGURATION
# -----------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173}

# -----------------------------------------------------------------------------
# SWAGGER / OPENAPI 3
# -----------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false
