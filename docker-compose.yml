version: '3.8'

services:
  # -------------------------------------------------------------------------
  # 1. DATABASE: MySQL 8.0 with automated 4FN schema and seed data
  # -------------------------------------------------------------------------
  mysql_db:
    image: mysql:8.0
    container_name: opus_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-opus_rentals_db}
      MYSQL_USER: ${DB_USER:-opus_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-opus_secure_password_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-opus_root_secret_2026}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u ${DB_USER:-opus_user} -p${DB_PASSWORD:-opus_secure_password_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - opus_network

  # -------------------------------------------------------------------------
  # 2. BACKEND: Spring Boot 3 with Java 21 & Hexagonal/DDD Architecture
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opus_backend
    restart: always
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:-mysql_db}:3306/${DB_NAME:-opus_rentals_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-opus_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-opus_secure_password_2026}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173}
      SERVER_PORT: ${BACKEND_PORT:-8081}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    networks:
      - opus_network

  # -------------------------------------------------------------------------
  # 3. FRONTEND: React SPA + Vite + Tailwind CSS + Nginx Alpine
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081/api/v1}
    container_name: opus_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - opus_network

volumes:
  mysql_data:
    name: opus_mysql_data

networks:
  opus_network:
    name: opus_network
    driver: bridge
